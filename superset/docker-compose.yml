version: "3.9"

x-superset-common: &superset-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  volumes:
    - superset_home:/app/superset_home
    # Mount the DuckDB database (read-only for safety)
    - ../data:/data:ro
  depends_on:
    superset-db:
      condition: service_healthy
    superset-cache:
      condition: service_healthy

services:
  superset-db:
    image: postgres:16-alpine
    container_name: superset-db
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  superset-cache:
    image: redis:7-alpine
    container_name: superset-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  superset-init:
    <<: *superset-common
    container_name: superset-init
    command: >
      bash -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.local --password admin &&
        superset init
      "
    depends_on:
      superset-db:
        condition: service_healthy
      superset-cache:
        condition: service_healthy

  superset-app:
    <<: *superset-common
    container_name: superset-app
    command: >
      gunicorn
        --bind 0.0.0.0:8088
        --workers 4
        --worker-class gthread
        --threads 4
        --timeout 120
        --limit-request-line 0
        --limit-request-field_size 0
        "superset.app:create_app()"
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  superset-worker:
    <<: *superset-common
    container_name: superset-worker
    command: celery --app=superset.tasks.celery_app:app worker --pool=prefork --concurrency=2
    depends_on:
      superset-init:
        condition: service_completed_successfully
    restart: unless-stopped

  superset-beat:
    <<: *superset-common
    container_name: superset-beat
    command: celery --app=superset.tasks.celery_app:app beat --pidfile /tmp/celerybeat.pid --schedule /tmp/celerybeat-schedule
    depends_on:
      superset-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  superset_home:
  superset_pg_data:
